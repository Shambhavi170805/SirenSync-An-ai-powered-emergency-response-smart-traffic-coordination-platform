<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SirenSync - AI Green Corridor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
    header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 18px; font-weight: bold; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-sim { background: #f59e0b; color: #000; }
    .badge-live { background: #10b981; color: #fff; }
    .container { display: flex; height: calc(100vh - 60px); }
    .map-pane { flex: 1.2; position: relative; border-right: 1px solid #334155; background: #1e293b; }
    .side-pane { flex: 0.8; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .panel h2 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #94a3b8; }
    img.stream { width: 100%; border-radius: 6px; background: #000; height: 260px; object-fit: contain; }
    .j-card { display: flex; justify-content: space-between; padding: 8px; margin-bottom: 6px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; }
    .pill { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    .pill.RED { background: #ef4444; color: #fff; }
    .pill.GREEN { background: #10b981; color: #fff; }
    .pill.HOLD { background: #f59e0b; color: #000; }
    .pill.AMBER { background: #f59e0b; color: #000; }
    .log-box { height: 160px; overflow-y: auto; background: #020617; padding: 8px; font-family: monospace; font-size: 11px; border-radius: 6px; border: 1px solid #334155; }
    .log-item { margin-bottom: 4px; border-bottom: 1px solid #1e293b; padding-bottom: 2px; }
    button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🚑 SirenSync: AI Green Corridor</h1>
    </div>
    <div>
      <span id="feed-badge" class="badge badge-sim">FEED: SIMULATED / TEST MODE</span>
      <span id="ws-badge" class="badge" style="background:#334155;">WS: CONNECTING...</span>
    </div>
  </header>

  <div class="container">
    <!-- Map Display Area -->
    <div id="map" class="map-pane">
      <div id="fallback-map" style="width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <svg width="460" height="300" viewBox="0 0 460 300">
          <line x1="50" y1="150" x2="410" y2="150" stroke="#334155" stroke-width="40"/>
          <line x1="50" y1="150" x2="410" y2="150" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
          <!-- J-1 -->
          <circle id="svg-j1" cx="150" cy="150" r="14" fill="#ef4444" stroke="#fff" stroke-width="2"/>
          <text x="150" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Junction 1</text>
          <!-- J-2 -->
          <circle id="svg-j2" cx="330" cy="150" r="14" fill="#ef4444" stroke="#fff" stroke-width="2"/>
          <text x="330" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Junction 2</text>
          <!-- Moving Ambulance -->
          <circle id="svg-amb" cx="60" cy="150" r="10" fill="#fff" stroke="#dc2626" stroke-width="3"/>
          <text id="svg-amb-lbl" x="60" y="130" fill="#fff" font-size="11" text-anchor="middle">🚑</text>
        </svg>
        <p style="color:#94a3b8; font-size:12px;">Google Maps Key Not Set in .env &mdash; Showing Corridor Vector View</p>
      </div>
    </div>

    <!-- Side Control & Telemetry Area -->
    <div class="side-pane">
      <!-- Live Video Panel -->
      <div class="panel">
        <h2>Live Video Feed (YOLOv10)</h2>
        <img class="stream" src="/video_feed/CAM-1" alt="Junction Camera Stream">
        <div style="margin-top:10px;">
          <button id="btn-dispatch">⚡ Dispatch Demo Ambulance</button>
        </div>
      </div>

      <!-- Junctions Signal Status Panel -->
      <div class="panel">
        <h2>Junction Signals</h2>
        <div id="junctions-list">Loading signals...</div>
      </div>

      <!-- Real-time Event Log Panel -->
      <div class="panel">
        <h2>Event Log</h2>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    let gMap = null, ambMarker = null, jMarkers = {};

    // 1. Fetch Configuration & Init Map
    fetch('/api/config').then(r => r.json()).then(cfg => {
      if (cfg.google_maps_api_key && cfg.google_maps_api_key !== "YOUR_GOOGLE_MAPS_API_KEY_HERE") {
        const s = document.createElement('script');
        s.src = `https://maps.googleapis.com/maps/api/js?key=${cfg.google_maps_api_key}&callback=initMap`;
        document.head.appendChild(s);
      }
      renderJunctions(cfg.junctions);
    });

    // 2. Google Maps Callback (when API key is present)
    window.initMap = function() {
      document.getElementById('fallback-map').style.display = 'none';
      gMap = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 12.9737, lng: 77.5979 },
        zoom: 14
      });

      // Sample route line
      new google.maps.Polyline({
        path: [{ lat: 12.9660, lng: 77.5880 }, { lat: 12.9716, lng: 77.5946 }, { lat: 12.9758, lng: 77.6012 }],
        strokeColor: "#2563eb",
        strokeWeight: 4,
        map: gMap
      });

      // Ambulance marker
      ambMarker = new google.maps.Marker({
        position: { lat: 12.9660, lng: 77.5880 },
        map: gMap,
        title: "Ambulance"
      });
    };

    // 3. Render Junctions List
    function renderJunctions(junctions) {
      const box = document.getElementById('junctions-list');
      box.innerHTML = '';
      junctions.forEach(j => {
        box.innerHTML += `
          <div class="j-card" id="card-${j.id}">
            <span>${j.name} (${j.id})</span>
            <span class="pill RED" id="pill-${j.id}">RED</span>
          </div>`;
      });
    }

    // 4. WebSocket connection
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${window.location.host}/ws/events`);

    ws.onopen = () => {
      document.getElementById('ws-badge').innerText = 'WS: CONNECTED';
      document.getElementById('ws-badge').style.background = '#10b981';
    };

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      addLog(data.event_type, JSON.stringify(data));

      if (data.event_type === 'SIGNAL_CHANGED') {
        const pill = document.getElementById(`pill-${data.junction_id}`);
        if (pill) {
          pill.className = `pill ${data.state}`;
          pill.innerText = data.state;
        }
        // Update SVG fallback map lights
        const svgLight = document.getElementById(data.junction_id === 'J-1' ? 'svg-j1' : 'svg-j2');
        if (svgLight) {
          svgLight.setAttribute('fill', data.state === 'GREEN' ? '#10b981' : (data.state === 'AMBER' ? '#f59e0b' : '#ef4444'));
        }
      }
    };

    function addLog(type, text) {
      const b = document.getElementById('log-box');
      const time = new Date().toLocaleTimeString();
      b.innerHTML = `<div class="log-item"><strong style="color:#60a5fa;">[${time}] ${type}</strong>: ${text}</div>` + b.innerHTML;
    }

    // 5. Dispatch Demo Ambulance Button
    document.getElementById('btn-dispatch').onclick = () => {
      fetch('/demo/dispatch', { method: 'POST' });
      addLog('DEMO', 'Dispatched ambulance run along corridor.');

      // Animate SVG fallback ambulance
      let x = 60;
      const anim = setInterval(() => {
        x += 10;
        const amb = document.getElementById('svg-amb');
        const lbl = document.getElementById('svg-amb-lbl');
        if (amb && lbl) {
          amb.setAttribute('cx', x);
          lbl.setAttribute('x', x);
        }
        if (x >= 400) clearInterval(anim);
      }, 300);
    };
  </script>
</body>
</html>
